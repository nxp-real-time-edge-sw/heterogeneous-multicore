CONFIG_MCUX_COMPONENT_component.silicon_id=n
CONFIG_MCUX_COMPONENT_component.rgpio_adapter=y
CONFIG_MCUX_COMPONENT_component.phygpy215=y

CONFIG_MCUX_COMPONENT_device.startup=y
CONFIG_MCUX_COMPONENT_utility.assert=n
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
