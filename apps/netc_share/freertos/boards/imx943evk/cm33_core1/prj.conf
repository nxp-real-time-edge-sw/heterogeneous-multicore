CONFIG_MCUX_PRJSEG_middleware.multicore.rpmsg-lite.generated_config=n

# core basic segments
CONFIG_MCUX_DEPENDENCY_COMPONENT_component.hal_clock_DEPEND_ANYOF_OPTION_2=y
